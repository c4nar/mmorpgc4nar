<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>2D Yuvarlak Karakter Multiplayer RPG</title>
    <!-- PeerJS: Multiplayer Altyapısı -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }

        /* LOBİ EKRANI */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            display: flex; justify-content: center; align-items: center;
        }
        .auth-card { background: #1e293b; border: 4px solid #38bdf8; border-radius: 12px; padding: 24px; width: 360px; max-width: 90%; text-align: center; }
        .auth-card h1 { font-size: 20px; color: #38bdf8; margin-bottom: 16px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
        .input-group input[type="text"], .input-group select { width: 100%; padding: 10px; border-radius: 6px; border: 2px solid #475569; background: #0f172a; color: #fff; text-align: center; }
        
        .photo-upload-area { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 10px; border-radius: 6px; border: 2px solid #475569; }
        .photo-preview { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #38bdf8; background: #334155; object-fit: cover; }
        .btn-upload { background: #3b82f6; color: white; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; border: none; font-weight: bold; }

        .btn-start { width: 100%; padding: 12px; background: #22c55e; border: 3px solid #15803d; border-radius: 6px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* OYUN İÇİ HUD */
        #game-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 100; }
        #room-info-badge { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 2px solid #f59e0b; color: #fbbf24; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 14px; pointer-events: auto; display: none; }
        #player-hud { position: absolute; top: 15px; left: 15px; width: 220px; background: rgba(15, 23, 42, 0.9); border: 3px solid #334155; border-radius: 8px; padding: 8px; pointer-events: auto; }
        .hud-title { font-size: 12px; font-weight: bold; color: #fbbf24; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .bar-container { width: 100%; height: 14px; background: #1e293b; border-radius: 4px; position: relative; overflow: hidden; margin-bottom: 5px; }
        .bar-fill-hp { height: 100%; background: #ef4444; width: 100%; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; font-size: 10px; font-weight: bold; text-align: center; line-height: 14px; }

        /* MOBİL JOYSTICK */
        #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px; pointer-events: auto; touch-action: none; display: none; }
        #joystick-base { width: 100%; height: 100%; background: rgba(255,255,255,0.15); border-radius: 50%; position: relative; }
        #joystick-stick { width: 50px; height: 50px; background: rgba(56,189,248,0.8); border-radius: 50%; position: absolute; top: 35px; left: 35px; }

        canvas { display: block; }
    </style>
</head>
<body>

    <!-- LOBİ EKRANI -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1>Yuvarlak & Fotoğraflı RPG</h1>
            
            <div class="input-group">
                <label>Karakter Adı</label>
                <input type="text" id="username-input" value="Savaşçı" maxlength="12">
            </div>

            <div class="input-group">
                <label>Karakter Fotoğrafı (İsteğe Bağlı)</label>
                <div class="photo-upload-area">
                    <img id="photo-preview" class="photo-preview" src="">
                    <input type="file" id="photo-input" accept="image/*" style="display:none;" onchange="handlePhotoUpload(event)">
                    <button class="btn-upload" onclick="document.getElementById('photo-input').click()">Fotoğraf Seç</button>
                </div>
            </div>

            <div class="input-group">
                <label>Cihaz Tipi</label>
                <select id="control-type-select">
                    <option value="pc">💻 Bilgisayar (Yön Tuşları/WASD)</option>
                    <option value="mobile">📱 Mobil (Dokunmatik Joystick)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Multiplayer (Çevrimiçi Mod)</label>
                <select id="mp-mode-select" onchange="toggleRoomInput()">
                    <option value="single">👤 Tek Oyunculu</option>
                    <option value="host">🌐 Oda Kur (Arkadaşlarını Davet Et)</option>
                    <option value="join">🔗 Odaya Katıl</option>
                </select>
            </div>

            <div class="input-group" id="room-code-group" style="display: none;">
                <label id="room-label">Oda Kodu</label>
                <input type="text" id="room-input" placeholder="Arkadaşının verdiği kodu gir">
            </div>

            <button class="btn-start" onclick="startGame()">Dünyaya Gir</button>
        </div>
    </div>

    <!-- OYUN HUD -->
    <div id="game-ui">
        <div id="room-info-badge">Oda Kodu: <span id="display-room-code" style="color: #fff;">Bekleniyor...</span></div>
        <div id="player-hud">
            <div class="hud-title"><span id="hud-name">Oyuncu</span></div>
            <div class="bar-container">
                <div class="bar-fill-hp" id="hp-bar-fill"></div>
                <div class="bar-text" id="hp-bar-text">100 / 100 CAN</div>
            </div>
        </div>

        <div id="joystick-zone">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WORLD = { width: 4000, height: 4000 };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let playerPhotoBase64 = null;
        let isMobileMode = false;

        // OYUNCU DURUMU
        let player = {
            id: Math.random().toString(36).substring(2, 9),
            name: "Oyuncu",
            photo: null,
            x: 2000, y: 2000,
            radius: 30, // Top boyutu
            speed: 5,
            hp: 100, maxHp: 100,
            color: "#38bdf8"
        };

        // MULTIPLAYER SİSTEMİ (EN BAŞTAN DÜZGÜN YAZILMIŞ)
        let peer = null;
        let connections = []; // Host için
        let hostConnection = null; // Client için
        let remotePlayers = {}; // Diğer oyuncular
        let isHost = false;

        // FOTOĞRAF YÜKLEME VE KÜÇÜLTME (Kasmasın diye 64x64 yapıyoruz)
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = 64; tempCanvas.height = 64;
                    const tCtx = tempCanvas.getContext('2d');
                    
                    const size = Math.min(img.width, img.height);
                    const sx = (img.width - size) / 2;
                    const sy = (img.height - size) / 2;
                    tCtx.drawImage(img, sx, sy, size, size, 0, 0, 64, 64);
                    
                    playerPhotoBase64 = tempCanvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('photo-preview').src = playerPhotoBase64;
                    player.photo = playerPhotoBase64;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ARAYÜZ KONTROLLERİ
        function toggleRoomInput() {
            const mode = document.getElementById('mp-mode-select').value;
            const group = document.getElementById('room-code-group');
            if (mode === 'join') {
                group.style.display = 'block';
            } else {
                group.style.display = 'none';
            }
        }

        // KONTROLLER (Klavye & Joystick)
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');
        let joyVector = { x: 0, y: 0 };
        let joyActive = false;

        function handleJoystick(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            let dx = clientX - cx, dy = clientY - cy;
            const dist = Math.hypot(dx, dy);
            if (dist > 40) { dx = (dx/dist)*40; dy = (dy/dist)*40; }
            joyStick.style.left = `${35 + dx}px`; joyStick.style.top = `${35 + dy}px`;
            joyVector.x = dx / 40; joyVector.y = dy / 40;
        }

        joyZone.addEventListener('pointerdown', e => { joyActive = true; joyZone.setPointerCapture(e.pointerId); handleJoystick(e.clientX, e.clientY); });
        joyZone.addEventListener('pointermove', e => { if(joyActive) handleJoystick(e.clientX, e.clientY); });
        function resetJoy() { joyActive = false; joyVector = {x:0,y:0}; joyStick.style.left = '35px'; joyStick.style.top = '35px'; }
        joyZone.addEventListener('pointerup', resetJoy); joyZone.addEventListener('pointercancel', resetJoy);

        // OYUN BAŞLATMA VE PEERJS BAĞLANTISI
        function startGame() {
            player.name = document.getElementById('username-input').value.trim() || "Oyuncu";
            isMobileMode = (document.getElementById('control-type-select').value === 'mobile');
            const mode = document.getElementById('mp-mode-select').value;
            const joinCode = document.getElementById('room-input').value.trim();

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            if (isMobileMode) document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('hud-name').innerText = player.name;

            if (mode === 'host') {
                isHost = true;
                const roomCode = Math.floor(1000 + Math.random() * 9000).toString(); // Örn: 4821
                
                // Host PeerJS başlat
                peer = new Peer('pxrpg-' + roomCode);
                
                peer.on('open', id => {
                    document.getElementById('room-info-badge').style.display = 'block';
                    document.getElementById('display-room-code').innerText = roomCode;
                });

                peer.on('connection', conn => {
                    connections.push(conn);
                    conn.on('data', data => {
                        if (data.type === 'playerUpdate') {
                            remotePlayers[data.player.id] = data.player; // İstemciden gelen veriyi kaydet
                        }
                    });
                    conn.on('close', () => { delete remotePlayers[conn.peer]; });
                });
            } 
            else if (mode === 'join') {
                if(!joinCode) { alert("Lütfen kod girin!"); location.reload(); return; }
                
                // Client PeerJS başlat
                peer = new Peer();
                peer.on('open', id => {
                    hostConnection = peer.connect('pxrpg-' + joinCode);
                    
                    hostConnection.on('open', () => {
                        document.getElementById('room-info-badge').style.display = 'block';
                        document.getElementById('display-room-code').innerText = "Bağlandı: " + joinCode;
                        document.getElementById('display-room-code').style.color = "#22c55e";
                    });

                    hostConnection.on('data', data => {
                        if (data.type === 'hostSync') {
                            remotePlayers = data.players; // Host tüm haritayı gönderir
                        }
                    });
                });
            }

            requestAnimationFrame(gameLoop);
            setInterval(syncMultiplayer, 1000 / 20); // Saniyede 20 kez veri yolla
        }

        // MULTIPLAYER VERİ SENKRONİZASYONU
        function syncMultiplayer() {
            if (isHost) {
                // Host, kendi oyuncusunu remote listesine eklemeden tüm listeyi client'lara atar
                let allPlayers = { ...remotePlayers };
                allPlayers[player.id] = player; // Host'un kendisi
                
                connections.forEach(conn => {
                    if (conn.open) {
                        // Sadece o client'ın verisini listeden çıkararak gönder (kendini çift görmesin)
                        let syncData = { ...allPlayers };
                        delete syncData[conn.peer]; 
                        conn.send({ type: 'hostSync', players: syncData });
                    }
                });
            } else if (hostConnection && hostConnection.open) {
                // Client, sadece kendi durumunu Host'a bildirir
                hostConnection.send({ type: 'playerUpdate', player: player });
            }
        }

        // FOTOĞRAF CACHE SİSTEMİ (Oyun içinde resimlerin yüklenmesi için)
        const imageCache = {};
        function drawAvatarBall(ctx, p, x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Yuvarlak Top (Kırpma Alanı)
            ctx.beginPath();
            ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
            ctx.closePath();
            
            // Eğer oyuncunun fotoğrafı varsa, topun içine çiz
            if (p.photo) {
                if (!imageCache[p.id]) {
                    const img = new Image();
                    img.src = p.photo;
                    imageCache[p.id] = img;
                }
                
                ctx.save();
                ctx.clip(); // Yuvarlak sınır
                if (imageCache[p.id].complete) {
                    ctx.drawImage(imageCache[p.id], -p.radius, -p.radius, p.radius * 2, p.radius * 2);
                }
                ctx.restore();
            } else {
                // Fotoğraf yoksa düz renk yap
                ctx.fillStyle = p.color;
                ctx.fill();
            }

            // Dış Çerçeve Çizgisi
            ctx.lineWidth = 4;
            ctx.strokeStyle = (p.id === player.id) ? "#22c55e" : "#e11d48"; // Kendimiz Yeşil, Başkası Kırmızı çerçeve
            ctx.stroke();

            ctx.restore();

            // İsim Yazısı
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px monospace";
            ctx.textAlign = "center";
            ctx.fillText(p.name, x, y - p.radius - 8);
        }

        // OYUN GÜNCELLEME DÖNGÜSÜ
        function updateGame() {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= 1;
            if (keys['s'] || keys['arrowdown']) dy += 1;
            if (keys['a'] || keys['arrowleft']) dx -= 1;
            if (keys['d'] || keys['arrowright']) dx += 1;
            
            if (isMobileMode && joyActive) { dx = joyVector.x; dy = joyVector.y; }

            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy) || 1;
                player.x += (dx / len) * player.speed;
                player.y += (dy / len) * player.speed;
            }

            // Harita sınırları
            player.x = Math.max(player.radius, Math.min(WORLD.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(WORLD.height - player.radius, player.y));
        }

        // ÇİZİM DÖNGÜSÜ
        function gameLoop() {
            updateGame();

            const camX = player.x - canvas.width / 2;
            const camY = player.y - canvas.height / 2;

            // Arka Plan
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Izgara (Grid) Çizimi (Hareket hissi için)
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 2;
            const gridSize = 100;
            const offsetX = -(camX % gridSize);
            const offsetY = -(camY % gridSize);
            ctx.beginPath();
            for (let x = offsetX; x < canvas.width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for (let y = offsetY; y < canvas.height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();

            // Diğer Oyuncuları Çiz
            for (let id in remotePlayers) {
                const rp = remotePlayers[id];
                if (rp.id === player.id) continue; // Kendimizi iki kere çizmeyelim
                drawAvatarBall(ctx, rp, rp.x - camX, rp.y - camY);
            }

            // Kendimizi Çiz
            drawAvatarBall(ctx, player, player.x - camX, player.y - camY);

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
