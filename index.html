<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>2D Pixel Open World Survival RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        /* KARAKTER OLUŞTURMA & GİRİŞ */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: #1e293b;
            border: 4px solid #38bdf8;
            border-radius: 12px;
            padding: 24px;
            width: 340px;
            text-align: center;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
        }

        .auth-card h1 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 16px;
            text-shadow: 2px 2px #000;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 2px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            text-align: center;
            outline: none;
        }

        .avatar-picker {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px dashed #38bdf8;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-color: #0f172a;
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            background: #22c55e;
            border: 3px solid #15803d;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* OYUN HUD */
        #game-ui {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        /* SOL ÜST CAN & XP */
        #player-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 240px;
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #334155;
            border-radius: 8px;
            padding: 8px;
            pointer-events: auto;
        }

        .hud-title {
            font-size: 12px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .bar-container {
            width: 100%;
            height: 16px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 4px;
            margin-bottom: 6px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill-hp { width: 100%; height: 100%; background: #ef4444; transition: width 0.2s; }
        .bar-fill-xp { width: 0%; height: 100%; background: #3b82f6; transition: width 0.2s; }

        .bar-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* SOL ORTA ÇANTA BUTONU */
        #btn-inventory-toggle {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            width: 54px;
            height: 54px;
            background: #1e293b;
            border: 3px solid #f59e0b;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* SAĞ ÜST STAT / ALTIN BUTONU */
        #top-right-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .hud-btn {
            background: #1e293b;
            border: 3px solid #38bdf8;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 5 SLOTLU ALT ENVANTER */
        #hotbar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            padding: 8px;
            border-radius: 10px;
            border: 3px solid #334155;
            pointer-events: auto;
        }

        .hot-slot {
            width: 48px;
            height: 48px;
            background: #1e293
